databaseChangeLog:

  - changeSet:
      id: 003-create-hotels-amenities
      author: zodiakk

      changes:

        - createTable:
            tableName: hotels_amenities
            columns:
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amenity_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: hotels_amenities
            columnNames: hotel_id, amenity_id
            constraintName: pk_hotels_amenities

        - addForeignKeyConstraint:
            baseTableName: hotels_amenities
            baseColumnNames: hotel_id
            referencedTableName: hotels
            referencedColumnNames: id
            constraintName: fk_hotels_amenities_hotel
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: hotels_amenities
            baseColumnNames: amenity_id
            referencedTableName: amenities
            referencedColumnNames: id
            constraintName: fk_hotels_amenities_amenity
            onDelete: RESTRICT
